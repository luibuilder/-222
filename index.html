<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>링크트리 메이커</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F2F0EC;
  --card:#fff;
  --border:#E2DED8;
  --text:#1A1A1A;
  --muted:#9A9490;
  --accent:#2C6E49;
  --accent2:#4A9066;
  --accent-bg:#EAF3EC;
  --sans:'Noto Sans KR',sans-serif;
  --serif:'Noto Serif KR',serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh;}

/* LEFT PANEL (Editor) */
.left{
  width:420px;flex-shrink:0;
  background:#fff;
  border-right:1px solid var(--border);
  overflow-y:auto;
  display:flex;flex-direction:column;
}
.left-header{
  padding:28px 28px 20px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;background:#fff;z-index:10;
}
.left-logo{
  font-family:var(--serif);font-size:1.3rem;font-weight:600;
  color:var(--text);margin-bottom:4px;
}
.left-logo span{color:var(--accent);}
.left-sub{font-size:0.72rem;color:var(--muted);}

.left-body{padding:24px 28px;display:flex;flex-direction:column;gap:28px;flex:1;}

/* Form Sections */
.form-section-title{
  font-size:0.62rem;letter-spacing:3px;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.form-section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* Input Fields */
.field{margin-bottom:12px;}
.field label{display:block;font-size:0.7rem;color:var(--muted);letter-spacing:0.5px;margin-bottom:5px;}
.field input,.field textarea,.field select{
  width:100%;background:var(--bg);
  border:1px solid var(--border);border-radius:9px;
  padding:10px 13px;font-family:var(--sans);font-size:0.85rem;
  color:var(--text);outline:none;transition:border-color 0.15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent2);}
.field textarea{resize:vertical;min-height:64px;line-height:1.5;}

/* Photo Upload */
.photo-upload{
  border:1.5px dashed var(--border);border-radius:12px;
  padding:20px;text-align:center;cursor:pointer;
  transition:border-color 0.15s,background 0.15s;
  position:relative;overflow:hidden;
}
.photo-upload:hover{border-color:var(--accent2);background:var(--accent-bg);}
.photo-upload input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo-preview{
  width:56px;height:56px;border-radius:50%;
  object-fit:cover;object-position:center top;
  margin:0 auto 8px;display:none;border:2px solid var(--accent);
}
.photo-icon{font-size:1.8rem;margin-bottom:6px;}
.photo-text{font-size:0.72rem;color:var(--muted);}

/* Link Card Items */
.link-items{display:flex;flex-direction:column;gap:8px;}
.link-item-row{
  background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;
  display:flex;gap:8px;align-items:center;
}
.link-remove{
  background:none;border:none;cursor:pointer;
  color:#CCC;font-size:1rem;padding:4px;transition:color 0.15s;
  flex-shrink:0;
}
.link-remove:hover{color:#F44;}

.link-move-btn {
  background:none;border:none;cursor:pointer;
  color:#BBB;font-size:0.68rem;padding:4px 2px;transition:color 0.15s;
  display:flex;flex-direction:column;align-items:center;
}
.link-move-btn:hover {color:var(--accent);}

/* Validation Warning Styles */
.invalid-url {
  border-color: #F44 !important;
  background-color: #FFF2F2 !important;
}
.validation-error {
  color: #F44;
  font-size: 0.65rem;
  margin-top: 3px;
}

/* Toast Notification Styles */
#toastContainer {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast-msg {
  background: rgba(26, 26, 26, 0.95);
  color: #fff;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 0.8rem;
  font-weight: 500;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.3s, transform 0.3s;
}
.toast-msg.show {
  opacity: 1;
  transform: translateY(0);
}

.btn-add-link{
  display:flex;align-items:center;gap:6px;
  background:none;border:1.5px dashed var(--border);
  border-radius:9px;padding:9px 14px;
  font-family:var(--sans);font-size:0.78rem;
  color:var(--muted);cursor:pointer;width:100%;
  justify-content:center;transition:all 0.15s;margin-top:4px;
}
.btn-add-link:hover{border-color:var(--accent2);color:var(--accent);}

/* Design Options */
.color-row{display:flex;gap:8px;flex-wrap:wrap;}
.color-opt{
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  border:2.5px solid transparent;transition:all 0.15s;
  position:relative;
}
.color-opt.active{border-color:var(--text);transform:scale(1.15);}
.color-opt::after{
  content:'✓';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:0.65rem;color:#fff;opacity:0;
}
.color-opt.active::after{opacity:1;}

/* Generate & Download Buttons */
.btn-generate{
  background:var(--accent);color:#fff;
  border:none;border-radius:12px;padding:14px;
  font-family:var(--sans);font-size:0.9rem;font-weight:700;
  cursor:pointer;width:100%;letter-spacing:0.5px;
  transition:background 0.15s,transform 0.1s;
  margin-top:4px;
}
.btn-generate:hover{background:var(--accent2);transform:translateY(-1px);}

.btn-download{
  background:#1A1A1A;color:#fff;
  border:none;border-radius:12px;padding:13px;
  font-family:var(--sans);font-size:0.85rem;font-weight:500;
  cursor:pointer;width:100%;letter-spacing:0.5px;
  transition:background 0.15s;display:none;margin-top:8px;
}
.btn-download:hover{background:#333;}

/* RIGHT PANEL (Preview) */
.right{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:var(--bg);
  position:sticky;top:0;height:100vh;overflow:hidden;
}

/* IFRAME MOCKUP WRAPPER */
.preview-iframe-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.preview-iframe {
  width: 100%;
  height: 100%;
  max-width: 480px;
  max-height: 800px;
  border: none;
  border-radius: 24px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.1);
  background: #ECEAF4;
}

@media(max-width:900px){
  .app{flex-direction:column;}
  .left{width:100%;}
  .right{position:static;height:auto;padding:32px 20px;min-height:750px;}
  .preview-iframe {max-height: 700px;}
}
</style>
</head>
<body>
<div id="toastContainer"></div>
<div class="app">

  <!-- ── LEFT: EDITOR PANEL ── -->
  <div class="left">
    <div class="left-header">
      <div class="left-logo">링크<span>트리</span> 메이커</div>
      <div class="left-sub">정보 입력 → 실시간 미리보기 → HTML 다운로드</div>
    </div>

    <div class="left-body">

      <!-- Profile Section -->
      <div class="form-section">
        <div class="form-section-title">프로필</div>

        <div class="field" style="margin-bottom:16px;">
          <label>프로필 사진</label>
          <div class="photo-upload" id="photoUpload">
            <input type="file" id="photoInput" accept="image/*">
            <img class="photo-preview" id="photoPreview">
            <div class="photo-icon" id="photoIcon">📷</div>
            <div class="photo-text" id="photoText">클릭하여 사진 업로드</div>
          </div>
        </div>

        <div class="field">
          <label>이름</label>
          <input type="text" id="inp-name" placeholder="예: 루이 Louis" value="루이 Louis">
        </div>
        <div class="field">
          <label>핸들 / 직함</label>
          <input type="text" id="inp-handle" placeholder="예: @louis · Startup Coach" value="@louis · Startup Coach">
        </div>
        <div class="field">
          <label>소개 한 줄</label>
          <textarea id="inp-bio" placeholder="예: 창업자와 함께 린하게 실행합니다">창업자와 함께 린하게 실행합니다</textarea>
        </div>
      </div>

      <!-- SNS Icons Section -->
      <div class="form-section">
        <div class="form-section-title">SNS 아이콘</div>
        <div style="font-size:0.7rem;color:var(--muted);margin-bottom:10px;">URL을 입력하면 아이콘이 나타나며, 비워두면 숨겨집니다.</div>
        <div class="field"><label>Instagram URL</label><input type="text" id="sns-insta" placeholder="https://instagram.com/..."></div>
        <div class="field"><label>카카오톡 채널 URL</label><input type="text" id="sns-kakao" placeholder="https://pf.kakao.com/..."></div>
        <div class="field"><label>YouTube URL</label><input type="text" id="sns-youtube" placeholder="https://youtube.com/..."></div>
        <div class="field"><label>LinkedIn URL</label><input type="text" id="sns-linkedin" placeholder="https://linkedin.com/in/..."></div>
        <div class="field"><label>이메일 주소</label><input type="text" id="sns-email" placeholder="example@email.com"></div>
      </div>

      <!-- Link Cards Section -->
      <div class="form-section">
        <div class="form-section-title">링크 카드</div>
        <div style="font-size:0.7rem;color:var(--muted);margin-bottom:10px;">첫 번째 카드는 강조(Featured) 카드로 크게 강조됩니다.</div>
        <div class="link-items" id="linkItems"></div>
        <button class="btn-add-link" id="btnAddLink">+ 링크 추가</button>
      </div>

      <!-- Design Section -->
      <div class="form-section">
        <div class="form-section-title">디자인</div>

        <div class="field">
          <label>폰 프레임 색상</label>
          <div class="color-row" id="colorRow">
            <div class="color-opt active" data-color="#2C6E49,#1E4228,#162E1C" style="background:linear-gradient(145deg,#2C6E49,#162E1C)" title="포레스트 그린"></div>
            <div class="color-opt" data-color="#B8922A,#8C6A18,#6B4F10" style="background:linear-gradient(145deg,#B8922A,#6B4F10)" title="골드"></div>
            <div class="color-opt" data-color="#2A2A2A,#111,#000" style="background:linear-gradient(145deg,#333,#000)" title="블랙"></div>
            <div class="color-opt" data-color="#1A3A6E,#0E2548,#091830" style="background:linear-gradient(145deg,#1A3A6E,#091830)" title="네이비"></div>
            <div class="color-opt" data-color="#8B2A2A,#5C1A1A,#3D0E0E" style="background:linear-gradient(145deg,#8B2A2A,#3D0E0E)" title="버건디"></div>
            <div class="color-opt" data-color="#4A3A6E,#2E2048,#1E1230" style="background:linear-gradient(145deg,#4A3A6E,#1E1230)" title="퍼플"></div>
          </div>
        </div>

        <div class="field">
          <label>프로필 배경 그라데이션</label>
          <div class="color-row" id="bgRow">
            <div class="color-opt active" data-bg="#BED4C2,#F8F5F0" style="background:linear-gradient(135deg,#BED4C2,#F8F5F0)" title="그린 페이드"></div>
            <div class="color-opt" data-bg="#D4C8A8,#F8F5F0" style="background:linear-gradient(135deg,#D4C8A8,#F8F5F0)" title="골드 페이드"></div>
            <div class="color-opt" data-bg="#C0C8D4,#F5F6F8" style="background:linear-gradient(135deg,#C0C8D4,#F5F6F8)" title="블루 페이드"></div>
            <div class="color-opt" data-bg="#D4C0C8,#F8F5F5" style="background:linear-gradient(135deg,#D4C0C8,#F8F5F5)" title="로즈 페이드"></div>
            <div class="color-opt" data-bg="#C8C0D4,#F6F5F8" style="background:linear-gradient(135deg,#C8C0D4,#F6F5F8)" title="라벤더 페이드"></div>
          </div>
        </div>

        <div class="field">
          <label>강조 카드 색상</label>
          <select id="accentColor">
            <option value="#2C6E49,#3D6B20">포레스트 그린</option>
            <option value="#2D5016,#3D6B20">딥 그린</option>
            <option value="#8C6A18,#B8922A">골드</option>
            <option value="#1A3A6E,#2A5090">네이비</option>
            <option value="#8B2A2A,#A03030">버건디</option>
            <option value="#1A1A1A,#333">블랙</option>
          </select>
        </div>
      </div>

      <!-- Action Buttons -->
      <div>
        <button class="btn-generate" id="btnGenerate">✦ HTML 파일 생성 & 다운로드</button>
        <button class="btn-download" id="btnDownload">⬇ 다시 다운로드</button>
      </div>

    </div>
  </div>

  <!-- ── RIGHT: LIVE PREVIEW PANEL ── -->
  <div class="right">
    <div class="preview-iframe-wrapper">
      <iframe class="preview-iframe" id="previewIframe" src="about:blank"></iframe>
    </div>
  </div>

</div>

<script>
// ── SVG ASSET DICTIONARY ──
const SVG = {
  insta: `<svg viewBox="0 0 24 24" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>`,

  youtube: `<svg viewBox="0 0 24 24" fill="white"><path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5a3 3 0 00-2.1 2.1A31.2 31.2 0 000 12a31.2 31.2 0 00.5 5.8 3 3 0 002.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 002.1-2.1A31.2 31.2 0 0024 12a31.2 31.2 0 00-.5-5.8zM9.7 15.5V8.5L15.9 12l-6.2 3.5z"/></svg>`,

  mail2: `<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M2 8l10 7 10-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`
};

const LINK_ICON_OPTIONS = [
  { val: '🚀', label: '🚀' },
  { val: '🌱', label: '🌱' },
  { val: '🧭', label: '🧭' },
  { val: '📅', label: '📅' },
  { val: '✍️', label: '✍️' },
  { val: '📮', label: '📮' },
  { val: '🎓', label: '🎓' },
  { val: '💬', label: '💬' },
  { val: '🛒', label: '🛒' },
  { val: '🔗', label: '🔗' }
];

// ── STATE ──
const state = {
  photoData: null,
  frameCurrent: '#2C6E49,#1E4228,#162E1C', // Forest Green default
  bgCurrent: '#BED4C2,#F8F5F0',          // Green fade default
  accentCurrent: '#2C6E49,#3D6B20'       // Forest Green accent default
};

// ── INITIALIZE ──
document.addEventListener('DOMContentLoaded', () => {
  // Add initial link cards
  addLinkCardItem('🚀', '링크 카드 제목', '설명을 입력하세요', '#');
  addLinkCardItem('🧭', '두 번째 링크', '', '#');

  // Bind static input listeners
  const inputs = [
    'inp-name', 'inp-handle', 'inp-bio',
    'sns-insta', 'sns-kakao', 'sns-youtube', 'sns-linkedin', 'sns-email'
  ];
  inputs.forEach(id => {
    document.getElementById(id).addEventListener('input', updateLivePreview);
  });

  // Bind validation to static SNS inputs (Error Prevention)
  const snsInputs = ['sns-insta', 'sns-kakao', 'sns-youtube', 'sns-linkedin', 'sns-email'];
  snsInputs.forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => validateURLInput(el));
  });

  // Bind design triggers
  setupDesignTriggers();

  // Photo upload trigger
  setupPhotoUpload();

  // Action buttons
  document.getElementById('btnGenerate').onclick = triggerOutputDownload;
  document.getElementById('btnDownload').onclick = triggerOutputDownload;
  document.getElementById('btnAddLink').onclick = () => addLinkCardItem();

  // Draw initial state
  updateLivePreview();
});

// ── LINK CARD CONTROLLER ──
function addLinkCardItem(icon = '🚀', title = '', desc = '', url = '') {
  const container = document.getElementById('linkItems');
  const cardId = 'card-' + Date.now() + Math.random().toString(36).substr(2, 5);
  const row = document.createElement('div');
  row.className = 'link-item-row';
  row.id = cardId;

  const iconOptions = LINK_ICON_OPTIONS.map(o => `<option value="${o.val}" ${o.val === icon ? 'selected' : ''}>${o.label}</option>`).join('');

  row.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:1px;margin-right:2px;">
      <button class="link-move-btn btn-up" title="위로 이동">▲</button>
      <button class="link-move-btn btn-down" title="아래로 이동">▼</button>
    </div>
    <select class="link-icon-sel" style="width:44px;padding:6px;font-size:0.9rem;border:1px solid var(--border);border-radius:7px;background:#fff;outline:none;">
      ${iconOptions}
    </select>
    <div style="flex:1;display:flex;flex-direction:column;">
      <input type="text" placeholder="제목" value="${title}" class="link-title-inp" style="width:100%;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:0.78rem;outline:none;">
    </div>
    <div style="flex:1;display:flex;flex-direction:column;">
      <input type="text" placeholder="설명 (선택)" value="${desc}" class="link-desc-inp" style="width:100%;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:0.78rem;outline:none;">
    </div>
    <div style="flex:1.2;display:flex;flex-direction:column;position:relative;">
      <input type="text" placeholder="URL" value="${url}" class="link-url-inp" style="width:100%;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:0.78rem;outline:none;">
      <span class="validation-error" style="display:none;">올바른 형식이 아닙니다 (http/https/mailto 등).</span>
    </div>
    <button class="link-remove">✕</button>
  `;

  // Bind change/remove events
  row.querySelector('.link-remove').onclick = () => {
    row.remove();
    updateLivePreview();
  };

  // Reordering button events (User Control & Freedom)
  row.querySelector('.btn-up').onclick = () => moveLinkCard(cardId, -1);
  row.querySelector('.btn-down').onclick = () => moveLinkCard(cardId, 1);

  // URL Validation (Error Prevention)
  const urlInput = row.querySelector('.link-url-inp');
  urlInput.addEventListener('input', () => {
    validateURLInput(urlInput);
  });

  row.querySelectorAll('input, select').forEach(element => {
    element.addEventListener('input', updateLivePreview);
  });

  container.appendChild(row);
  validateURLInput(urlInput); // Initial check
  updateLivePreview();
}

// ── PHOTO UPLOAD CONTROLLER ──
function setupPhotoUpload() {
  const uploader = document.getElementById('photoInput');
  uploader.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      state.photoData = event.target.result;
      
      const preview = document.getElementById('photoPreview');
      preview.src = state.photoData;
      preview.style.display = 'block';

      document.getElementById('photoIcon').style.display = 'none';
      document.getElementById('photoText').textContent = '사진 변경';
      
      updateLivePreview();
    };
    reader.readAsDataURL(file);
  });
}

// ── DESIGN PANEL CONTROLLER ──
function setupDesignTriggers() {
  // Bezel color
  document.querySelectorAll('#colorRow .color-opt').forEach(opt => {
    opt.onclick = function() {
      document.querySelectorAll('#colorRow .color-opt').forEach(el => el.classList.remove('active'));
      this.classList.add('active');
      state.frameCurrent = this.dataset.color;
      updateLivePreview();
    };
  });

  // Profile Background
  document.querySelectorAll('#bgRow .color-opt').forEach(opt => {
    opt.onclick = function() {
      document.querySelectorAll('#bgRow .color-opt').forEach(el => el.classList.remove('active'));
      this.classList.add('active');
      state.bgCurrent = this.dataset.bg;
      updateLivePreview();
    };
  });

  // Accent selector
  document.getElementById('accentColor').onchange = function() {
    state.accentCurrent = this.value;
    updateLivePreview();
  };
}

// ── DOM STATE EXTRACTOR ──
function getCurrentBuilderData() {
  const links = [];
  document.querySelectorAll('.link-item-row').forEach(row => {
    links.push({
      icon: row.querySelector('.link-icon-sel').value,
      title: row.querySelector('.link-title-inp').value || '제목',
      desc: row.querySelector('.link-desc-inp').value,
      url: row.querySelector('.link-url-inp').value || '#'
    });
  });

  return {
    name: document.getElementById('inp-name').value || '이름',
    handle: document.getElementById('inp-handle').value || '@handle',
    bio: document.getElementById('inp-bio').value || '',
    photoData: state.photoData,
    sns: {
      insta: document.getElementById('sns-insta').value,
      kakao: document.getElementById('sns-kakao').value,
      youtube: document.getElementById('sns-youtube').value,
      linkedin: document.getElementById('sns-linkedin').value,
      email: document.getElementById('sns-email').value
    },
    links: links,
    theme: {
      frame: state.frameCurrent,
      profileBg: state.bgCurrent,
      accent: state.accentCurrent || document.getElementById('accentColor').value
    }
  };
}

// ── LIVE PREVIEW CONTROLLER ──
function updateLivePreview() {
  const data = getCurrentBuilderData();
  const htmlContent = generateLinktreeHTML(data);
  
  // Set output to iframe
  const iframe = document.getElementById('previewIframe');
  iframe.srcdoc = htmlContent;
}

// ── HTML GENERATOR (Unified template - DRY Principle) ──
function generateLinktreeHTML(data) {
  const [fc1, fc2, fc3] = data.theme.frame.split(',');
  const [bg1, bg2] = data.theme.profileBg.split(',');
  const [ac1, ac2] = data.theme.accent.split(',');

  // SNS links
  const snsItems = [
    { key: 'insta', val: data.sns.insta, bg: 'radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)', label: 'Instagram', svg: SVG.insta },
    { key: 'kakao', val: data.sns.kakao, bg: '#FEE500', label: '카카오', svg: SVG.kakao },
    { key: 'youtube', val: data.sns.youtube, bg: '#FF0000', label: 'YouTube', svg: SVG.youtube },
    { key: 'linkedin', val: data.sns.linkedin, bg: '#0A66C2', label: 'LinkedIn', svg: SVG.linkedin },
    { key: 'email', val: data.sns.email, bg: '#555', label: '이메일', svg: SVG.email }
  ].filter(s => s.val);

  const snsHTML = snsItems.map(s => {
    const href = s.key === 'email' ? `mailto:${s.val}` : s.val;
    return `<a class="ic" href="${href}" target="_blank"><div class="ic-circle" style="background:${s.bg}">${s.svg}</div><span class="ic-label">${s.label}</span></a>`;
  }).join('');

  // Link cards
  const cardsHTML = data.links.map((link, i) => {
    const isFeat = i === 0;
    const cardStyle = isFeat ? `background:linear-gradient(135deg,${ac1},${ac2});` : 'background:#fff;';
    const titleColor = isFeat ? 'color:#fff;' : '';
    const descColor = isFeat ? 'color:rgba(255,255,255,0.55);' : '';
    const icoStyle = isFeat ? 'background:rgba(255,255,255,0.14);' : 'background:#EDF2E8;';
    return `
      <a class="card" href="${link.url}" target="_blank" style="${cardStyle}">
        <div class="c-ico" style="${icoStyle}">${link.icon}</div>
        <div class="c-body">
          <div class="c-title" style="${titleColor}">${link.title}</div>
          ${link.desc ? `<div class="c-desc" style="${descColor}">${link.desc}</div>` : ''}
        </div>
        <div class="c-arr" style="${isFeat ? 'color:rgba(255,255,255,0.4);' : ''}">↗</div>
      </a>
    `;
  }).join('');

  // Avatar icon
  const avatarHTML = data.photoData
    ? `<img src="${data.photoData}" style="width:100%;height:100%;object-fit:cover;object-position:center top;">`
    : `<span style="font-family:'Noto Serif KR',serif;font-size:1.4rem;font-weight:600;color:#fff;">${data.name.charAt(0) || '?'}</span>`;

  return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${data.name}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#E8EBE8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px 56px;font-family:'Noto Sans KR',sans-serif;}
  .phone{width:270px;background:linear-gradient(160deg,${fc1} 0%,${fc2} 45%,${fc3} 100%);border-radius:50px;padding:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.15),inset 0 -1px 0 rgba(0,0,0,0.4),0 0 0 0.5px rgba(0,0,0,0.3),0 48px 120px rgba(0,0,0,0.35),0 20px 50px rgba(0,0,0,0.25);position:relative;animation:rise .6s cubic-bezier(.16,1,.3,1) both;}
  .phone::before{content:'';position:absolute;right:-2px;top:100px;width:2px;height:48px;background:${fc2};border-radius:0 1.5px 1.5px 0;box-shadow:0 60px 0 ${fc2};}
  .phone::after{content:'';position:absolute;left:-2px;top:76px;width:2px;height:28px;background:${fc2};border-radius:1.5px 0 0 1.5px;box-shadow:0 40px 0 ${fc2};}
  .ring{position:absolute;inset:3px;border-radius:48px;border:1px solid rgba(255,255,255,0.1);pointer-events:none;z-index:10;}
  .screen{background:#F8F5F0;border-radius:48px;overflow:hidden;}
  .ibar{background:#F8F5F0;height:25px;display:flex;align-items:flex-end;justify-content:center;}
  .island{background:#111;width:86px;height:21px;border-radius:0 0 15px 15px;}
  .sbar{background:#F8F5F0;padding:4px 16px 2px;display:flex;align-items:center;justify-content:space-between;}
  .sbar-t{font-size:.6rem;font-weight:600;color:#111;}
  .sbar-i{display:flex;gap:3px;align-items:center;}
  .content{max-height:580px;overflow-y:auto;padding-bottom:20px;scrollbar-width:none;}
  .content::-webkit-scrollbar{display:none;}
  .profile{background:linear-gradient(180deg,${bg1} 0%,#F8F5F0 100%);padding:20px 0 16px;display:flex;flex-direction:column;align-items:center;}
  .avatar{width:68px;height:68px;border-radius:50%;border:2.5px solid rgba(255,255,255,.9);box-shadow:0 4px 16px rgba(0,0,0,.16);margin-bottom:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,${ac1},${ac2});}

  .ic{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;}
  .ic-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.12);}
  .ic-circle svg{width:16px;height:16px;}
  .ic-label{font-size:.5rem;color:#BBB;white-space:nowrap;}
  .sep{height:1px;background:#EAE5DF;margin:0 12px;}
  .cards{padding:10px 10px 0;display:flex;flex-direction:column;gap:5px;}
  .card{display:flex;align-items:center;gap:7px;border-radius:10px;padding:9px 10px;text-decoration:none;color:#1C1C1C;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:transform 0.12s;}
  .card:hover{transform:translateX(2px);}
  .c-ico{width:25px;height:25px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0;}

  .c-arr{font-size:.55rem;color:#DDD;flex-shrink:0;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px 10px 0;}
  .gi{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;}
  .gi-icon{width:42px;height:42px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.07);border:1px solid rgba(0,0,0,.04);transition:transform 0.12s;}
  .gi-icon:hover{transform:translateY(-2px);}
  .gi-icon svg{width:20px;height:20px;}
  .gi-label{font-size:.5rem;color:#AAA;text-align:center;}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="phone">
  <div class="ring"></div>
  <div class="screen">
    <div class="ibar"><div class="island"></div></div>
    <div class="sbar">
      <span class="sbar-t">9:41</span>
      <div class="sbar-i">
        <svg width="13" height="9" viewBox="0 0 13 9" fill="#111"><rect x="0" y="2.5" width="2.5" height="6.5" rx=".7"/><rect x="3.5" y="1.5" width="2.5" height="7.5" rx=".7"/><rect x="7" y="0" width="2.5" height="9" rx=".7"/><rect x="10.5" y="0" width="2.5" height="9" rx=".7" opacity=".25"/></svg>
        <svg width="13" height="9" viewBox="0 0 13 9" fill="#111"><path d="M6.5 1.5C8.8 1.5 10.8 2.5 12.2 4L13 3.2C11.4 1.2 9.1 0 6.5 0S1.6 1.2 0 3.2l.8.8C2.2 2.5 4.2 1.5 6.5 1.5z" opacity=".25"/><path d="M6.5 3.5c1.5 0 2.9.6 3.9 1.6l.8-.8C10 3.1 8.3 2.5 6.5 2.5S3 3.1 1.8 4.3l.8.8C3.6 4.1 5 3.5 6.5 3.5z" opacity=".6"/><path d="M6.5 5.5c.9 0 1.7.4 2.3.9L9.6 5.6C8.7 4.9 7.7 4.5 6.5 4.5S4.3 4.9 3.4 5.6l.8.8C4.8 5.9 5.6 5.5 6.5 5.5z"/><circle cx="6.5" cy="8" r="1"/></svg>
        <svg width="22" height="9" viewBox="0 0 22 9" fill="none"><rect x=".5" y=".5" width="17" height="8" rx="2" stroke="#111" stroke-width="1"/><rect x="1.5" y="1.5" width="13" height="6" rx="1.2" fill="#111"/><rect x="18.5" y="3" width="2.5" height="3" rx=".8" fill="#111" opacity=".4"/></svg>

// ── EXPORTER (Single Responsibility Principle) ──
function triggerOutputDownload() {
  const data = getCurrentBuilderData();
  const htmlContent = generateLinktreeHTML(data);
  const filename = `${data.name.replace(/\s/g, '-')}-linktree.html`;
  
  downloadHTMLFile(htmlContent, filename);
  document.getElementById('btnDownload').style.display = 'block';
  showToast('HTML 파일이 성공적으로 다운로드되었습니다!');
}

function downloadHTMLFile(content, filename) {
  const blob = new Blob([content], { type: 'text/html;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── CARD REORDERING CONTROLLER (User Control & Freedom) ──
function moveLinkCard(cardId, direction) {
  const row = document.getElementById(cardId);
  if (!row) return;

  const container = document.getElementById('linkItems');
  if (direction === -1) {
    const prev = row.previousElementSibling;
    if (prev) {
      container.insertBefore(row, prev);
      showToast('카드가 위로 이동되었습니다.');
    }
  } else if (direction === 1) {
    const next = row.nextElementSibling;
    if (next) {
      container.insertBefore(next, row);
      showToast('카드가 아래로 이동되었습니다.');
    }
  }
  updateLivePreview();
}

// ── URL VALIDATION (Heuristic #5: Error Prevention) ──
function validateURLInput(inputElement) {
  const url = inputElement.value.trim();
  const errorMsg = inputElement.nextElementSibling;
  
  const isValid = url === '' || url === '#' || 
                  url.startsWith('http://') || 
                  url.startsWith('https://') || 
                  url.startsWith('mailto:') || 
                  url.startsWith('tel:');

  if (isValid) {
    inputElement.classList.remove('invalid-url');
    if (errorMsg && errorMsg.classList.contains('validation-error')) {
      errorMsg.style.display = 'none';
    }
  } else {
    inputElement.classList.add('invalid-url');
    if (errorMsg && errorMsg.classList.contains('validation-error')) {
      errorMsg.style.display = 'block';
    }
  }
}

// ── TOAST NOTIFICATION CONTROLLER (Heuristic #1: System Status Visibility) ──
function showToast(message) {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = 'toast-msg';
  toast.innerHTML = `✦ ${message}`;
  container.appendChild(toast);

  // Trigger CSS transition
  setTimeout(() => toast.classList.add('show'), 10);

  // Auto remove
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}
</script>
